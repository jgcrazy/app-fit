name: Deploy — produção

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false


# Mesmo motivo do staging: publicar no GHCR exige packages: write. Ver #4.
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Configurar "Required reviewers" em Settings > Environments.
    environment: production
    # Sem servidor configurado, o deploy publica a imagem e para antes do SSH
    # (secrets não podem ir direto num `if:`, por isso a variável). Ver #20.
    env:
      TEM_SERVIDOR: ${{ secrets.PROD_HOST != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:prod-${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sem servidor de production
        if: env.TEM_SERVIDOR != 'true'
        run: echo "::notice::PROD_HOST não configurado. Imagem publicada no GHCR; deploy no servidor pulado (#20)."

      - name: Deploy com rollback automático
        if: env.TEM_SERVIDOR == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ghcr.io/${{ github.repository }}/api:prod-${{ github.sha }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: IMAGE
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/app-fit-prod

            # Guardar a imagem atual para poder voltar. Health check sem isto
            # só falha o job e deixa o container quebrado servindo. Ver ADR 0007.
            cp .env.deploy .env.deploy.prev 2>/dev/null || true
            echo "API_IMAGE=${IMAGE}" > .env.deploy

            docker compose pull api

            # Backup antes de migrar. Rollback de container não desfaz migration.
            mkdir -p backups
            docker compose exec -T postgres \
              pg_dump -U app_fit app_fit | gzip > "backups/pre-migrate-$(date +%Y%m%d-%H%M%S).sql.gz"

            docker compose run --rm api php artisan migrate --force
            docker compose up -d --remove-orphans api

            for i in $(seq 1 12); do
              if curl -fsS http://localhost:3000/api/health > /dev/null; then
                echo "health ok"
                exit 0
              fi
              echo "aguardando health ($i/12)..."
              sleep 5
            done

            echo "::error::health gate falhou — revertendo para a imagem anterior"
            if [ -f .env.deploy.prev ]; then
              mv .env.deploy.prev .env.deploy
              docker compose pull api
              docker compose up -d --force-recreate api
              echo "rollback aplicado (schema NÃO revertido — ver ADR 0007)"
            fi
            exit 1
