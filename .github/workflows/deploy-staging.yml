name: Deploy — staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

# Sem packages: write o GITHUB_TOKEN não publica no GHCR ("installation not
# allowed to Create organization package"). Ver #4.
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:staging-${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy com rollback automático
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ghcr.io/${{ github.repository }}/api:staging-${{ github.sha }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: IMAGE
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/app-fit-staging

            # Guardar a imagem atual para poder voltar. Health check sem isto
            # só falha o job e deixa o container quebrado servindo. Ver ADR 0007.
            cp .env.deploy .env.deploy.prev 2>/dev/null || true
            echo "API_IMAGE=${IMAGE}" > .env.deploy

            docker compose pull api

            # Backup antes de migrar. Rollback de container não desfaz migration.
            mkdir -p backups
            docker compose exec -T postgres \
              pg_dump -U app_fit app_fit | gzip > "backups/pre-migrate-$(date +%Y%m%d-%H%M%S).sql.gz"

            docker compose run --rm api php artisan migrate --force
            docker compose up -d --remove-orphans api

            for i in $(seq 1 12); do
              if curl -fsS http://localhost:3001/api/health > /dev/null; then
                echo "health ok"
                exit 0
              fi
              echo "aguardando health ($i/12)..."
              sleep 5
            done

            echo "::error::health gate falhou — revertendo para a imagem anterior"
            if [ -f .env.deploy.prev ]; then
              mv .env.deploy.prev .env.deploy
              docker compose pull api
              docker compose up -d --force-recreate api
              echo "rollback aplicado (schema NÃO revertido — ver ADR 0007)"
            fi
            exit 1
