name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app_test
          POSTGRES_PASSWORD: app_test_password
          POSTGRES_DB: app_fit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, bcmath, intl, redis
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependências
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: app_fit_test
          DB_USERNAME: app_test
          DB_PASSWORD: app_test_password
        run: php artisan migrate --force

      # Migration precisa voltar. Sem isto, o expand/contract do ADR 0007
      # é promessa, não garantia.
      - name: Migrations são reversíveis
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: app_fit_test
          DB_USERNAME: app_test
          DB_PASSWORD: app_test_password
        run: |
          php artisan migrate:rollback --force --step=100
          php artisan migrate --force

      - name: Testes
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: app_fit_test
          DB_USERNAME: app_test
          DB_PASSWORD: app_test_password
          REDIS_HOST: 127.0.0.1
          CACHE_STORE: redis
        run: php artisan test

  # O nome dos jobs é o que a proteção de branch exige: não renomeie sem
  # atualizar as regras de main e develop.
  mobile:
    name: Mobile — testes, typecheck e lint
    runs-on: ubuntu-latest
    # Sem `if: hashFiles(...)` aqui: hashFiles não existe no `if` de job, e isso
    # invalidava o workflow inteiro (nenhum job rodava). Ver #3.

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci

      # Design system Ensign: gerados em dia com tokens.json, e nenhuma tela fora do sistema.
      - name: Design system (ds:ci)
        working-directory: .
        run: npm run ds:ci

      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test -- --ci

  commits:
    name: Commits — padrão e issue
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Todo commit do PR: Conventional Commits em português, citando a issue (#N).
      - name: Mensagens de commit
        run: |
          git log --format=%H "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --no-merges |
            while read -r sha; do
              git log -1 --format=%B "$sha" > /tmp/msg
              node scripts/check-commit-msg.mjs /tmp/msg || { echo "Commit ${sha:0:7} fora do padrão"; exit 1; }
            done
      - name: PR ligado a uma issue
        env:
          CORPO: ${{ github.event.pull_request.body }}
        run: |
          echo "$CORPO" | grep -Eiq '(closes|fixes|resolves|refs) #[0-9]+' ||
            { echo 'O PR precisa citar a issue: "Closes #N" (ou "Refs #N").'; exit 1; }
