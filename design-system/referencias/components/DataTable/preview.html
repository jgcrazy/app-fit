<div id="raiz"></div>
<script>

    { key: 'cliente', label: 'Cliente' },
    { key: 'criado', label: 'Criado em', sortable: true, sort: 'desc' },
    { key: 'itens', label: 'Itens', numeric: true },
    { key: 'total', label: 'Total', numeric: true, sortable: true },
    { key: 'status', label: 'Status' },
    { key: 'acoes', label: '' },
  ];

  var LINHAS = [
    { pedido: '#1042', cliente: 'Ariane Martins', criado: '23/11 19:42', itens: 3, total: 'R$ 128,90', status: 'pending' },
    { pedido: '#1041', cliente: 'Marcos Vitor',   criado: '23/11 19:08', itens: 1, total: 'R$ 42,00',  status: 'active' },

        h(E.Button, { variant: 'primary', size: 'md', icon: 'plus' }, 'Novo pedido')

      h(E.DataTable, { columns: COLUNAS, rows: LINHAS, range: '41–45 de 338' })

  ReactDOM.createRoot(document.getElementById('raiz')).render(h(Demo));
