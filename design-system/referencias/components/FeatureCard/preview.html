        title: 'Pedido #1042 — Ariane Martins',
        meta: 'Hoje, 19:42 · 3 itens',
        value: 'R$ 128,90',
        status: 'pending',
        statusLabel: 'Em rota',

  ReactDOM.createRoot(document.getElementById('raiz')).render(h(Demo));
