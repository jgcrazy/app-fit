<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>App — Dieta</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ensign-theme.css">
<link rel="stylesheet" href="ds/ensign/components/bundle.css">
<script src="ds/ensign/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; }
.dt-sec { margin: 0; font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--content-secondary); }
.dt-bar { height: 8px; border-radius: 9999px; background: var(--surface-raised); overflow: hidden; }
.dt-fill { height: 100%; border-radius: 9999px; }
.dt-sheet { background: var(--surface-overlay); border-top-left-radius: var(--radius-2xl); border-top-right-radius: var(--radius-2xl); box-shadow: var(--shadow-lg); padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
.dt-grab { width: 32px; height: 4px; border-radius: 9999px; background: var(--border-strong); margin: 4px auto 4px; }
</style>
</helmet>

<div data-theme="app" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--surface-canvas); display: flex; flex-direction: column; font-family: var(--font-sans); overflow: hidden; position: relative">

  <div style="height: 44px; flex: 0 0 auto; background: var(--surface-brand)"></div>
  <x-import component-from-global-scope="Ensign.AppHeader" title="Dieta"></x-import>

  <div style="flex: 1 1 auto; overflow: hidden; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 20px">

    <div style="background: var(--surface-raised); border: 1px solid var(--border-default); border-radius: var(--radius-card); padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <p class="dt-sec">Hoje</p>
        <span style="font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--content-muted)">1.180 / 2.200 kcal</span>
      </div>
      <div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 6px">
          <span style="font-size: 13px; color: var(--content-secondary)">Proteína</span>
          <span style="font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--content-primary)">148 / 170 g</span>
        </div>
        <div class="dt-bar"><div class="dt-fill" style="width: 87%; background: var(--chart-6)"></div></div>
      </div>
      <div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 6px">
          <span style="font-size: 13px; color: var(--content-secondary)">Carboidrato</span>
          <span style="font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--content-primary)">112 / 240 g</span>
        </div>
        <div class="dt-bar"><div class="dt-fill" style="width: 47%; background: var(--chart-2)"></div></div>
      </div>
      <div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 6px">
          <span style="font-size: 13px; color: var(--content-secondary)">Gordura</span>
          <span style="font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--content-primary)">38 / 70 g</span>
        </div>
        <div class="dt-bar"><div class="dt-fill" style="width: 54%; background: var(--chart-1)"></div></div>
      </div>
    </div>

    <p class="dt-sec">Refeições</p>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <x-import component-from-global-scope="Ensign.ListCard" title="Café da manhã" meta="Ovos, aveia, banana" value="480 kcal" status="active" status-label="Registrado"></x-import>
      <x-import component-from-global-scope="Ensign.ListCard" title="Almoço" meta="Frango, arroz, brócolis" value="700 kcal" status="active" status-label="Registrado"></x-import>
      <x-import component-from-global-scope="Ensign.ListCard" title="Pré-treino" meta="Ainda não registrado" status="pending" status-label="Pendente"></x-import>
    </div>

  </div>

  <div class="dt-sheet">
    <div class="dt-grab" aria-hidden="true"></div>
    <p style="margin: 0; font-family: var(--font-display); font-size: 20px; line-height: 26px; font-weight: 700; color: var(--content-primary)">Adicionar ao pré-treino</p>
    <x-import component-from-global-scope="Ensign.Field" label="Alimento" placeholder="Busque ou escaneie o código"></x-import>
    <div style="display: flex; gap: 12px">
      <div style="flex: 1 1 0">
        <x-import component-from-global-scope="Ensign.Field" label="Quantidade" placeholder="100" help="Em gramas."></x-import>
      </div>
      <div style="flex: 1 1 0">
        <x-import component-from-global-scope="Ensign.Field" as="select" label="Refeição" options="{{refeicoes}}"></x-import>
      </div>
    </div>
    <div style="display: flex; gap: 12px">
      <x-import component-from-global-scope="Ensign.Button" variant="ghost" size="lg">Cancelar</x-import>
      <div style="flex: 1 1 auto; display: flex">
        <x-import component-from-global-scope="Ensign.Button" variant="primary" size="lg" style="flex: 1 1 auto">Adicionar</x-import>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      refeicoes: [
        { value: 'pre', label: 'Pré-treino' },
        { value: 'pos', label: 'Pós-treino' },
        { value: 'jantar', label: 'Jantar' },
      ],
    };
  }
}
</script>
</body>
</html>
